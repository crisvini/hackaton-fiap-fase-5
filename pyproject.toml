[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stride-threat-mvp"
version = "0.1.0"
description = "MVP de modelagem de ameacas STRIDE a partir de diagrama de arquitetura com OpenAI Vision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "PyYAML>=6.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
stride-mvp = "stride_mvp.cli:app"
stride-mvp-api = "stride_mvp.api:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

